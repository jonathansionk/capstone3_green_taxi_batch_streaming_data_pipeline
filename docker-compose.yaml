x-airflow-common: &airflow-common
  build: .
  image: jcdeah-airflow:3.3.0

  env_file:
    - .env

  environment: &airflow-env
    # Airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    # Airflow 3 Web UI
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}"

    # Database metadata Airflow
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "${FERNET_KEY}"

    # Google Cloud
    GCP_PROJECT_ID: "${GCP_PROJECT_ID}"
    GOOGLE_CLOUD_PROJECT: "${GCP_PROJECT_ID}"
    AIRFLOW_GCP_CONN_ID: "${AIRFLOW_GCP_CONN_ID:-google_cloud_default}"

    GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
    CLOUDSDK_CONFIG: /home/airflow/.config/gcloud

    AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: >-
      {"conn_type":"google_cloud_platform","extra":{"project":"${GCP_PROJECT_ID}"}}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./sql:/opt/airflow/sql:ro
    - "${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro"

  user: "${AIRFLOW_UID:-50000}:0"


services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  airflow-init:
    <<: *airflow-common
    command: version
    user: "0:0"

    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${_AIRFLOW_WWW_USER_USERNAME:-airflow}"
      _AIRFLOW_WWW_USER_PASSWORD: "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}"

    depends_on:
      postgres:
        condition: service_healthy


  airflow-apiserver:
    <<: *airflow-common
    command: api-server

    ports:
      - "8090:8080"

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully


volumes:
  postgres-db-volume: